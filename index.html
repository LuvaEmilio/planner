<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planner</title>
<meta name="theme-color" content="#F2F2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: Apple-achtige app. Desktop: glazen zijbalk + werkvlak. Mobiel: navigatiebalk boven, tabbalk onder.
   Kleur: neutrale systeemtinten + één tint (palet), semantische kleuren voor Werk / Pauze / Overig. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --brand:var(--font);
  --bg:#F2F2F4;--panel:#FFFFFF;--fg:#1D1D1F;--dim:#6E6E73;--lijn:#E3E3E6;--soft:#F5F5F7;--fill:#E9E9EC;--segsel:#FFFFFF;
  --accent:#2B2B2B;--onaccent:#FFFFFF;--glass:rgba(250,250,252,.78);
  --werk-bg:#DCF3E2;--werk-fg:#17642F;--werk-dot:#2FA552;
  --pauze-bg:#FFEBCC;--pauze-fg:#874A00;--pauze-dot:#E8900C;
  --overig-bg:#E2E2FA;--overig-fg:#35339E;--overig-dot:#5E5CE6;
  --danger:#D70015;--now:#FF3B30;--ok:#248A3D;--scrim:rgba(0,0,0,.28);
  --toast-bg:#1D1D1F;--toast-fg:#FFFFFF;
  --shadow:0 1px 1px rgba(0,0,0,.03),0 8px 28px rgba(0,0,0,.06);
  --shadow-lg:0 20px 60px rgba(0,0,0,.18);
  --r-xl:22px;--r-lg:16px;--r-md:12px;--r-sm:9px;
  --ease:cubic-bezier(.2,.8,.2,1);--ease-in:cubic-bezier(.4,0,1,1);--spring:cubic-bezier(.32,1.2,.5,1);
  --dur-fast:140ms;--dur:240ms;--dur-slow:380ms;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111113;--panel:#1C1C1E;--fg:#F5F5F7;--dim:#A1A1A6;--lijn:#2F2F33;--soft:#232326;--fill:#2C2C2F;--segsel:#5A5A5F;
    --accent:#F5F5F7;--onaccent:#111113;--glass:rgba(28,28,30,.78);
    --werk-bg:#1E3626;--werk-fg:#8BE3A4;--werk-dot:#32D74B;--pauze-bg:#3A2A10;--pauze-fg:#FFC66E;--pauze-dot:#FF9F0A;--overig-bg:#28284A;--overig-fg:#B4B2FF;--overig-dot:#7D7AFF;
    --danger:#FF453A;--now:#FF453A;--ok:#30D158;--scrim:rgba(0,0,0,.5);--toast-bg:#F5F5F7;--toast-fg:#111113;--shadow:none;--shadow-lg:0 20px 60px rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111113;--panel:#1C1C1E;--fg:#F5F5F7;--dim:#A1A1A6;--lijn:#2F2F33;--soft:#232326;--fill:#2C2C2F;--segsel:#5A5A5F;
  --accent:#F5F5F7;--onaccent:#111113;--glass:rgba(28,28,30,.78);
  --werk-bg:#1E3626;--werk-fg:#8BE3A4;--werk-dot:#32D74B;--pauze-bg:#3A2A10;--pauze-fg:#FFC66E;--pauze-dot:#FF9F0A;--overig-bg:#28284A;--overig-fg:#B4B2FF;--overig-dot:#7D7AFF;
  --danger:#FF453A;--now:#FF453A;--ok:#30D158;--scrim:rgba(0,0,0,.5);--toast-bg:#F5F5F7;--toast-fg:#111113;--shadow:none;--shadow-lg:0 20px 60px rgba(0,0,0,.6);color-scheme:dark;
}
/* Weergave uit Instellingen: de app zet .light of .dark op body */
body.light{--bg:#F2F2F4;--panel:#FFFFFF;--fg:#1D1D1F;--dim:#6E6E73;--lijn:#E3E3E6;--soft:#F5F5F7;--fill:#E9E9EC;--segsel:#FFFFFF;--accent:#2B2B2B;--onaccent:#FFFFFF;--glass:rgba(250,250,252,.78);
  --werk-bg:#DCF3E2;--werk-fg:#17642F;--werk-dot:#2FA552;--pauze-bg:#FFEBCC;--pauze-fg:#874A00;--pauze-dot:#E8900C;--overig-bg:#E2E2FA;--overig-fg:#35339E;--overig-dot:#5E5CE6;
  --danger:#D70015;--now:#FF3B30;--ok:#248A3D;--scrim:rgba(0,0,0,.28);--toast-bg:#1D1D1F;--toast-fg:#FFFFFF;--shadow:0 1px 1px rgba(0,0,0,.03),0 8px 28px rgba(0,0,0,.06);--shadow-lg:0 20px 60px rgba(0,0,0,.18);color-scheme:light}
body.dark{--bg:#111113;--panel:#1C1C1E;--fg:#F5F5F7;--dim:#A1A1A6;--lijn:#2F2F33;--soft:#232326;--fill:#2C2C2F;--segsel:#5A5A5F;--accent:#F5F5F7;--onaccent:#111113;--glass:rgba(28,28,30,.78);
  --werk-bg:#1E3626;--werk-fg:#8BE3A4;--werk-dot:#32D74B;--pauze-bg:#3A2A10;--pauze-fg:#FFC66E;--pauze-dot:#FF9F0A;--overig-bg:#28284A;--overig-fg:#B4B2FF;--overig-dot:#7D7AFF;
  --danger:#FF453A;--now:#FF453A;--ok:#30D158;--scrim:rgba(0,0,0,.5);--toast-bg:#F5F5F7;--toast-fg:#111113;--shadow:none;--shadow-lg:0 20px 60px rgba(0,0,0,.6);color-scheme:dark}
/* Kleurpaletten: een tint per palet, in licht en donker */
body.light.pal-minimaal{--accent:#141414;--bg:#F4F4F2}
body.light.pal-oceaan{--accent:#2F4156;--bg:#EFF3F7;--soft:#F3F6F9}
body.light.pal-salie{--accent:#3F5A45;--bg:#F0F4EE;--soft:#F4F7F2}
body.light.pal-terracotta{--accent:#9C4F35;--bg:#F8F1EC;--soft:#FAF5F1}
body.light.pal-lavendel{--accent:#5B4A93;--bg:#F4F1F9;--soft:#F7F5FB}
body.light.pal-zand{--accent:#6F5B3B;--bg:#F7F3EB;--soft:#FAF7F1}
body.dark.pal-minimaal{--accent:#FFFFFF;--onaccent:#111113;--bg:#0E0E0F}
body.dark.pal-oceaan{--accent:#9DBEDA;--onaccent:#0E1A24;--bg:#0F151C;--panel:#18212B;--soft:#1C2632;--fill:#25313F;--lijn:#2B3747}
body.dark.pal-salie{--accent:#A9C9A0;--onaccent:#111A13;--bg:#101511;--panel:#19211B;--soft:#1E2820;--fill:#273329;--lijn:#2C382E}
body.dark.pal-terracotta{--accent:#E3A68C;--onaccent:#221510;--bg:#161110;--panel:#221917;--soft:#2A1F1C;--fill:#352825;--lijn:#3A2C28}
body.dark.pal-lavendel{--accent:#C2B4F0;--onaccent:#18142A;--bg:#121019;--panel:#1D1A28;--soft:#232031;--fill:#2D293D;--lijn:#332E45}
body.dark.pal-zand{--accent:#DCC8A2;--onaccent:#1E1A12;--bg:#14120E;--panel:#1F1C17;--soft:#26221C;--fill:#302B23;--lijn:#36302A}
body.pal-nacht{--bg:#1A2533;--panel:#2A3B4F;--fg:#F5EFEB;--dim:#C3D3E0;--lijn:#3B4F68;--soft:#22303F;--fill:#344A62;--segsel:#4E6580;--accent:#C8D9E6;--onaccent:#1A2533;--glass:rgba(42,59,79,.8)}

html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- structuur ---------- */
.layout{display:flex;align-items:flex-start;min-height:100vh;min-height:100dvh}
.sidebar{width:272px;flex:none;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;padding:22px 14px 18px;display:flex;flex-direction:column;gap:22px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-right:1px solid var(--lijn)}
.content{flex:1;min-width:0;padding-inline:16px;padding-block:28px 56px}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar,.tabbar{display:none}
.clockbar{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0 6px;text-align:center}
.clk{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.clk .sec{font-size:18px;font-weight:500;color:var(--dim);letter-spacing:0;margin-left:3px}
.clkd{font-size:13px;font-weight:600;color:var(--dim)}
.topclock{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;line-height:1.1;font-variant-numeric:tabular-nums}
.topclock b{font-size:17px;font-weight:600}
.topclock span{font-size:11px;font-weight:600;color:var(--dim)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;color:var(--fg)}
.brand svg{height:28px;width:auto;flex:none}
.brand b{font-family:var(--brand);font-weight:400;font-size:19px;letter-spacing:.01em;line-height:1}
.brand span{display:block;font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.brand .bt{border-left:1px solid var(--lijn);padding-left:12px}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav .cap{font-size:12px;font-weight:600;color:var(--dim);padding:0 10px 6px}
.navi{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:none;border-radius:var(--r-sm);background:transparent;font-size:15px;font-weight:500;text-align:left}
.navi svg{color:var(--accent)}
.navi:hover{background:var(--fill)}
.navi[aria-current="page"]{background:var(--accent);color:var(--onaccent)}
.navi[aria-current="page"] svg{color:var(--onaccent)}

/* ---------- typografie ---------- */
.eyebrow{font-size:13px;font-weight:600;color:var(--dim)}
.large{font-size:clamp(28px,4.2vw,36px);font-weight:700;letter-spacing:-.022em;line-height:1.1;text-wrap:balance}
.h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.h3{font-size:17px;font-weight:600}
.cap{font-size:13px;color:var(--dim)}

/* ---------- knoppen ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:none;background:var(--accent);color:var(--onaccent);font-size:15px;font-weight:600;white-space:nowrap;transition:transform var(--dur-fast) var(--ease),opacity var(--dur-fast) var(--ease)}
.btn:active{transform:scale(.97)}
.btn.tint{background:var(--fill);color:var(--fg)}
.btn.tint:hover{background:var(--lijn)}
.btn.danger{background:var(--fill);color:var(--danger)}
.btn.block{width:100%;min-height:50px;border-radius:var(--r-md);font-size:17px}
.btn[disabled]{opacity:.4;pointer-events:none}
.ib{width:40px;height:40px;border-radius:999px;border:none;background:var(--fill);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0;transition:transform var(--dur-fast) var(--ease)}
.ib:hover{background:var(--lijn)}
.ib:active{transform:scale(.94)}
.ib[disabled]{opacity:.35;pointer-events:none}
.pillgroup{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:999px;background:var(--fill)}
.pillgroup .ib{background:transparent}
.pillgroup .ib:hover,.pillgroup .lnk:hover{background:var(--segsel)}
.pillgroup .lnk{min-height:36px;padding:0 14px;border:none;border-radius:999px;background:transparent;font-size:14px;font-weight:600}
.filebtn{position:relative}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---------- segmented control ---------- */
.seg{display:flex;padding:2px;border-radius:var(--r-sm);background:var(--fill);gap:2px;max-width:100%}
.seg button{flex:1 1 0;min-width:0;min-height:34px;padding:0 12px;border:none;border-radius:7px;background:transparent;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background-color var(--dur-fast) var(--ease)}
.seg button[aria-pressed="true"]{background:var(--segsel);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg.inline{display:inline-flex}
.dot{width:9px;height:9px;border-radius:999px;flex:none;display:inline-block}
.dot-werk{background:var(--werk-dot)}.dot-pauze{background:var(--pauze-dot)}.dot-overig{background:var(--overig-dot)}
.dot-gum{background:transparent;border:1.5px dashed currentColor}

/* ---------- kaarten en gegroepeerde lijsten ---------- */
.card{background:var(--panel);border-radius:var(--r-xl);box-shadow:var(--shadow)}
.widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.widget{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.widget .t{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--dim)}
.widget .v{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.widget .v small{font-size:14px;font-weight:500;color:var(--dim);letter-spacing:0;margin-left:4px}
.bar{display:flex;height:6px;border-radius:999px;background:var(--fill);overflow:hidden;width:100%}
.bar i{display:block;height:100%}
.bar .bw{background:var(--werk-dot)}.bar .bp{background:var(--pauze-dot)}.bar .bo{background:var(--overig-dot)}
.prog{height:6px;border-radius:999px;background:var(--fill);overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:var(--werk-dot);transform-origin:left;transition:width var(--dur-slow) var(--ease)}
.gtitle{font-size:13px;font-weight:600;color:var(--dim);padding:0 16px 6px;text-transform:uppercase;letter-spacing:.04em}
.gfoot{font-size:13px;color:var(--dim);padding:7px 16px 0;line-height:1.4}
.group{background:var(--panel);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
.cell{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 16px;width:100%;border:none;background:transparent;text-align:left;font-size:16px}
.cell + .cell::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--lijn)}
.cell .lab{flex:1;min-width:0}
.cell .sub{display:block;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.cell .val{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.cell.btnrow{color:var(--accent);font-weight:500}
.cell.btnrow:hover,.cell.tap:hover{background:var(--soft)}
.cell.tap:active,.cell.btnrow:active{background:var(--fill)}
.cell.red{color:var(--danger)}
.chev{color:var(--dim);opacity:.6;flex:none}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;border:none;background:transparent;color:var(--dim);font-size:16px;text-align:right;text-align-last:right;padding:8px 20px 8px 4px;min-height:40px;cursor:pointer;font-variant-numeric:tabular-nums}
.sel::after{content:"";position:absolute;right:4px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.cell input[type=text]{border:none;background:transparent;text-align:right;color:var(--dim);font-size:16px;min-height:40px;min-width:0;width:100%;max-width:240px;padding:0}
.cell input[type=text]::placeholder{color:var(--dim);opacity:.6}
.icon-sq{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#FFFFFF}
.sq-werk{background:var(--werk-dot)}.sq-pauze{background:var(--pauze-dot)}.sq-overig{background:var(--overig-dot)}.sq-acc{background:var(--accent);color:var(--onaccent)}.sq-red{background:var(--danger)}

/* ---------- rooster ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.toolbar .seg{flex:0 1 420px}
.grow{flex:1}
.hint{font-size:13px;color:var(--dim)}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 14px}
.wgrid{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));min-width:620px}
.dgrid{display:grid;grid-template-columns:52px minmax(0,1fr)}
.dayhead{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;padding:6px 2px 10px;border:none;background:transparent;border-radius:var(--r-sm)}
.dayhead:hover{background:var(--soft)}
.dayhead .dn{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.dayhead .dd{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.dayhead[aria-current="date"] .dd{background:var(--now);color:#FFFFFF}
.dayhead[aria-current="date"] .dn{color:var(--now)}
.hcol{position:relative}
.hl{position:absolute;right:8px;font-size:11px;font-weight:500;color:var(--dim);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px solid var(--lijn);touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.col.today{background:var(--soft)}
.slot{display:block;width:100%;border:none;border-top:1px solid transparent;background:transparent;padding:0;margin:0}
.slot.hr{border-top-color:var(--lijn)}
.slot.hh{border-top:1px dashed var(--lijn)}
@media (hover:hover){.slot:hover{background:var(--fill)}}
.slot:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.blk{position:absolute;left:3px;right:3px;border-radius:8px;padding:4px 7px;overflow:hidden;pointer-events:none;display:flex;flex-direction:column;gap:1px;line-height:1.2}
.blk-werk{background:var(--werk-bg);color:var(--werk-fg)}.blk-pauze{background:var(--pauze-bg);color:var(--pauze-fg)}.blk-overig{background:var(--overig-bg);color:var(--overig-fg)}
.blk b{font-size:12px;font-weight:700}
.blk span{font-size:11px;font-weight:500;opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
.blk.tiny{padding:0 7px;flex-direction:row;align-items:center;gap:6px}
.blk.tiny b,.blk.tiny span{font-size:10px}
.nowline{position:absolute;left:-4px;right:0;height:2px;background:var(--now);pointer-events:none;z-index:2}
.nowline::before{content:"";position:absolute;left:-1px;top:-4px;width:10px;height:10px;border-radius:999px;background:var(--now)}
.nowtag{position:absolute;right:4px;top:-9px;padding:1px 6px;border-radius:999px;background:var(--now);color:#FFFFFF;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
.daycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.daycard{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:var(--r-lg);border:none;background:var(--panel);box-shadow:var(--shadow);text-align:left;min-width:0;transition:transform var(--dur-fast) var(--ease)}
.daycard:active{transform:scale(.98)}
.daycard .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.split > *{min-width:0}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .trk{stroke:var(--fill)}
.ring .val{stroke:var(--werk-dot);transition:stroke-dashoffset var(--dur-slow) var(--ease)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .in span{font-size:11px;color:var(--dim)}
.empty{padding:22px 16px;text-align:center;color:var(--dim);font-size:15px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* ---------- mini-kalender ---------- */
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;text-align:center}
.cal .wd{font-size:11px;font-weight:600;color:var(--dim);padding-bottom:4px}
.calday{position:relative;height:34px;border:none;border-radius:999px;background:transparent;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.calday:hover{background:var(--fill)}
.calday.out{color:var(--dim);opacity:.55}
.calday.wk{background:var(--fill)}
.calday.sel{background:var(--accent);color:var(--onaccent)}
.calday[aria-current="date"]:not(.sel){color:var(--now);font-weight:700}
.calday i{position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:999px;background:var(--werk-dot)}
.calday.sel i{background:var(--onaccent)}

/* ---------- status ---------- */
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--dim);padding:5px 10px;border-radius:999px;background:var(--fill);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:999px;background:var(--dim)}
.sync.ok i{background:var(--ok)}.sync.busy i{background:var(--pauze-dot)}.sync.bad i{background:var(--danger)}
.sync.busy i{animation:pulse 1s var(--ease) infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}

/* ---------- sheet (dialoogvenster) ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity var(--dur) var(--ease);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;top:50%;width:min(460px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:auto;background:var(--bg);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);padding:8px 16px 18px;transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform var(--dur-slow) var(--spring),opacity var(--dur) var(--ease)}
.sheet-open .scrim{opacity:1}
.sheet-open .sheet{transform:translate(-50%,-50%) scale(1);opacity:1}
.sheet .grab{display:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px}
.sheet-head h2{font-size:17px;font-weight:600;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell > .sel{margin-left:auto;min-width:0;max-width:68%}
.cell > .sel select{max-width:100%;text-overflow:ellipsis}
.sheet-head .txtbtn{min-width:76px;min-height:44px;border:none;background:transparent;color:var(--accent);font-size:17px}
.sheet-head .txtbtn.strong{font-weight:600}
.sheet-head .txtbtn[disabled]{opacity:.35}
.sheet-body{display:flex;flex-direction:column;gap:18px;padding-top:6px}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;color:var(--dim);padding:0 4px}
.note.warn{color:var(--pauze-fg)}

/* ---------- melding ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));z-index:50;display:flex;align-items:center;gap:14px;max-width:min(560px,calc(100vw - 32px));padding:10px 10px 10px 18px;border-radius:999px;background:var(--toast-bg);color:var(--toast-fg);box-shadow:var(--shadow-lg);font-size:14px;font-weight:500;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast.err{background:var(--danger);color:#FFFFFF}
.toast button{border:none;background:transparent;color:inherit;font-weight:700;min-height:36px;padding:0 10px;border-radius:999px;text-decoration:underline;text-underline-offset:3px}
.toast button:hover{background:rgba(127,127,127,.18)}


/* ---------- soorten, kleurkeuze, delen ---------- */
.toolbar .chips{flex:1 1 320px}
.chips{display:flex;gap:6px;overflow-x:auto;min-width:0;padding:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;border-radius:999px;border:none;background:var(--fill);color:var(--fg);font-size:14px;font-weight:600;white-space:nowrap;transition:transform var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease)}
.chip:hover{background:var(--lijn)}
.chip:active{transform:scale(.96)}
.chip.gum[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
.chip.add{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--lijn)}
.chip.add:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.bar.big{height:10px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 18px}
.lg{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.lg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .hv{font-weight:600}
.lg small{font-size:12px}
.catprev{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);transition:background-color var(--dur-fast) var(--ease)}
.catprev b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.catprev .num{font-size:13px;font-weight:500;opacity:.9}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:10px;padding:4px}
.swb{position:relative;width:40px;height:40px;border-radius:999px;border:none;justify-self:center;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);cursor:pointer;transition:transform var(--dur-fast) var(--ease)}
.swb:active{transform:scale(.92)}
.swb[aria-checked="true"],.swb.custom.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.swb.custom{background:conic-gradient(#FF3B30,#FFCC00,#34C759,#00C7BE,#0A84FF,#AF52DE,#FF3B30)}
.swb.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0}
.switch{position:relative;width:51px;height:31px;border-radius:999px;border:none;background:var(--fill);flex:none;padding:0;transition:background-color var(--dur) var(--ease)}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#FFFFFF;box-shadow:0 2px 5px rgba(0,0,0,.22);transition:transform var(--dur) var(--spring)}
.switch[aria-checked="true"]{background:#34C759}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.sharehead{display:flex;align-items:center;gap:12px;padding:4px 2px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps b{font-size:15px}
.stepn{width:28px;height:28px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--fill);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.stepn.done{background:#34C759;color:#FFFFFF}
.steps .btn{align-self:flex-start;text-decoration:none}
.sheet{width:min(480px,calc(100vw - 24px));max-height:calc(100dvh - 32px)}
.cell .dot{width:10px;height:10px}

/* ---------- telefoon: rustig overzicht ---------- */
.qbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:12px 16px;border:none;border-radius:var(--r-lg);background:var(--panel);box-shadow:var(--shadow);text-align:left;color:var(--fg);transition:transform var(--dur-fast) var(--ease)}
.qbtn:hover{background:var(--soft)}
.qbtn:active{transform:scale(.98)}
.qbtn .lab{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qbtn .lab b{font-size:16px;font-weight:600}
.qbtn .sub{font-size:13px;color:var(--dim);line-height:1.35}
.qbtn .val{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:600;flex:none}
.daysum{padding:16px 18px;display:flex;align-items:center;gap:16px}
.daysum .bar{margin-top:6px}
.ring.sm .in b{font-size:17px}
.ring.sm .in span{font-size:10px}
.dayrow{min-height:64px;padding-top:10px;padding-bottom:10px}
.dayrow .lab{display:flex;flex-direction:column;gap:1px;font-weight:500}
.dayrow .bar{margin-top:6px;height:5px}
.dayrow .val{font-weight:600;color:var(--fg);font-size:17px}
.dayrow .val.okv{color:var(--ok)}
.cell + .dayrow::before,.dayrow + .cell::before{left:72px}
.daybadge{width:42px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.daybadge b{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.daybadge span{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.daybadge.today b,.daybadge.today span{color:var(--now)}
@media (max-width: 899px){
  .large{font-size:26px}
  .page{gap:16px}
  .topbar .sync{font-size:0;gap:0;padding:8px}
  .topbar .sync i{width:9px;height:9px}
  .topbar .ib{width:38px;height:38px}
  .seg button{padding:0 8px}
}

/* ---------- beweging (alleen transform en opacity; uit bij 'minder beweging') ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fromnext{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes fromprev{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ringfill{from{stroke-dashoffset:var(--c)}}
@keyframes blkin{from{opacity:0;transform:scaleY(.6)}to{opacity:1;transform:none}}
@keyframes hit{0%{transform:scale(1)}35%{transform:scale(1.09)}65%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes glow{0%{opacity:.55;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
.page.enter > *{animation:rise var(--dur-slow) var(--ease) both}
.page.enter.from-next > *:not(.clockbar){animation-name:fromnext}
.page.enter.from-prev > *:not(.clockbar){animation-name:fromprev}
.page.enter > :nth-child(2){animation-delay:30ms}.page.enter > :nth-child(3){animation-delay:60ms}.page.enter > :nth-child(4){animation-delay:90ms}
.page.enter > :nth-child(5){animation-delay:120ms}.page.enter > :nth-child(6){animation-delay:150ms}.page.enter > :nth-child(7){animation-delay:180ms}.page.enter > :nth-child(n+8){animation-delay:210ms}
.page.enter .group > .dayrow{animation:rise var(--dur-slow) var(--ease) both}
.page.enter .group > .dayrow:nth-child(2){animation-delay:40ms}.page.enter .group > .dayrow:nth-child(3){animation-delay:80ms}.page.enter .group > .dayrow:nth-child(4){animation-delay:120ms}.page.enter .group > .dayrow:nth-child(5){animation-delay:160ms}
.page.enter .daycards > .daycard{animation:rise var(--dur-slow) var(--ease) both}
.page.enter .daycards > :nth-child(2){animation-delay:40ms}.page.enter .daycards > :nth-child(3){animation-delay:80ms}.page.enter .daycards > :nth-child(4){animation-delay:120ms}.page.enter .daycards > :nth-child(5){animation-delay:160ms}
.page.enter .prog i,.page.enter .bar{transform-origin:left center;animation:grow 700ms var(--ease) 140ms both}
.page.enter .ring .val{animation:ringfill 900ms var(--ease) 160ms both}
.page.enter .blk{animation:rise var(--dur) var(--ease) both}
.blk-new{transform-origin:top center;animation:blkin 220ms var(--spring) both}
.ring{position:relative}
.ring.hit{animation:hit 620ms var(--spring) both}
.ring.hit::after{content:"";position:absolute;inset:0;border-radius:999px;box-shadow:0 0 0 6px var(--werk-dot);animation:glow 700ms var(--ease) both;pointer-events:none}
.tabbar button svg{transition:transform var(--dur-fast) var(--ease)}
.tabbar button:active svg{transform:scale(.88)}
.navi,.cell.tap,.dayhead,.calday{transition:background-color var(--dur-fast) var(--ease)}
.daycard:hover{transform:translateY(-2px)}
.daycard{transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
/* ---------- mobiel ---------- */
@media (max-width: 899px){
  .sidebar{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--lijn)}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--lijn)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;border:none;background:transparent;color:var(--dim);font-size:11px;font-weight:600}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .content{padding-block:18px calc(110px + env(safe-area-inset-bottom, 0px))}
  .hide-m{display:none!important}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
  .toolbar .seg{flex:1 1 100%}
}
@media (min-width: 900px){ .show-m{display:none!important} }
@media (pointer:coarse){ .seg button{min-height:40px} .slot{min-height:0} }
button:focus-visible,select:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
/* ---- algemeen (planner) ---- */
.cell input[type=date],.cell input[type=password]{border:none;background:transparent;text-align:right;color:var(--dim);font:inherit;font-size:16px;min-height:40px;min-width:0;width:100%;max-width:240px;padding:0;-webkit-appearance:none;appearance:none}
.cell input[type=date]::-webkit-date-and-time-value{text-align:right}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:var(--fill);color:var(--dim);font-size:12px;font-weight:600;white-space:nowrap}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.ib.sm{width:34px;height:34px}
.btn:disabled{opacity:.45;pointer-events:none}
.fbta{width:100%;font:inherit;font-size:16px;line-height:1.4;color:var(--fg);background:var(--panel);border:none;border-radius:var(--r-md);padding:12px 14px;resize:vertical;box-shadow:inset 0 0 0 .5px var(--lijn);min-height:48px}
.fbta:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.spin{width:28px;height:28px;border-radius:999px;border:3px solid var(--fill);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block}

@keyframes spin{to{transform:rotate(360deg)}}
.sheet.wide{width:min(720px,calc(100vw - 24px))}
.fbempty{padding:36px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.note svg{flex:none;width:16px;height:16px;margin-top:1px}

/* ---- planning ---- */
.pdot{display:inline-block;width:9px;height:9px;border-radius:999px;flex:none;vertical-align:1px;margin-right:5px}
.ptool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ptool .seg{flex:0 0 auto}

.pconf{padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow),inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 45%,transparent)}

.vchip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,#F08A00 18%,transparent);color:#B25E00}
.vchip.akkoord{background:color-mix(in srgb,var(--ok) 18%,transparent);color:color-mix(in srgb,var(--ok) 75%,#000)}

body.dark .vchip{color:#FFB54D} body.dark .vchip.akkoord{color:var(--ok)}
/* weekraster */
.pgrid{padding:0;overflow:hidden}
.pg-head,.pg-allday,.pg-body{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr))}
.pg-head{border-bottom:.5px solid var(--lijn)}

.pg-dh:hover{background:var(--fill)}

.pg-chip{border:none;border-radius:6px;padding:3px 6px;font-size:12px;font-weight:600;text-align:left;background:color-mix(in srgb,var(--c) 18%,var(--panel));color:var(--fg);box-shadow:inset 3px 0 0 var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}

.pev-time{flex:none;width:46px;font-size:13px;line-height:1.3;color:var(--dim);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;justify-content:center}
.pev .lab{padding:8px 0}
.pev.conf{background:color-mix(in srgb,var(--danger) 6%,transparent)}
.pev-warn{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:12px;font-weight:700;color:var(--danger)}
.pev-warn svg{width:13px;height:13px}
/* 4 weken */
.pper{padding:0 0 14px;overflow:hidden}
.pp-head,.pp-row{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;padding:0 12px}
.pp-head span{font-size:11.5px;font-weight:600;color:var(--dim);text-transform:uppercase;text-align:center;padding:6px 0}
.pp-row{margin-bottom:4px}
.pp-wk{border:none;background:transparent;font-size:11px;color:var(--dim);font-weight:600;cursor:pointer;padding:0}
.pp-cell{position:relative;min-height:84px;border:none;border-radius:10px;background:var(--soft);padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer;color:var(--fg);overflow:hidden;transition:background-color var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
.pp-cell:hover{background:var(--fill)}
.pp-cell:active{transform:scale(.97)}
.pp-cell.wknd{background:color-mix(in srgb,var(--soft) 50%,transparent)}
.pp-cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.pp-cell.conf{box-shadow:inset 0 0 0 2px var(--danger)}
.pp-n{font-size:13px;font-weight:700}
.pp-dots{display:flex;gap:3px}
.pp-dots i{width:8px;height:8px;border-radius:999px}
.pp-l{font-size:11px;line-height:1.25;color:var(--dim);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.pp-bang{position:absolute;right:5px;top:5px;width:16px;height:16px;border-radius:999px;background:var(--danger);color:#fff;font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pp-cell .vchip{margin-top:auto;align-self:flex-start}
.pp-sum{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 16px 0;font-size:13px;color:var(--dim)}
.pp-sum b{color:var(--fg)}
.pp-sum .bad{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.pp-sum svg{width:15px;height:15px}
/* inlezen */
.pimp-list{display:flex;flex-direction:column;max-height:300px;overflow:auto;border-radius:10px;background:var(--panel)}
.pimp-r{display:grid;grid-template-columns:22px 74px 86px 1fr;gap:8px;align-items:center;padding:8px 10px;border-bottom:.5px solid var(--lijn);font-size:13.5px;cursor:pointer}
.pimp-r input{width:18px;height:18px;accent-color:var(--accent)}
.pimp-d{font-weight:600}
.pimp-t{color:var(--dim);font-variant-numeric:tabular-nums}
.pimp-x{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width: 899px){
  .ptool{gap:6px}
  .ptool .btn span{display:none}
  .ptool .btn{padding:0 12px}
  .pp-head,.pp-row{grid-template-columns:30px repeat(7,minmax(0,1fr));gap:3px;padding:0 8px}
  .pp-cell{min-height:64px;padding:5px 4px;border-radius:8px}
  .pp-l{display:none}
  .pp-n{font-size:12px}
  .pp-cell .vchip{font-size:0;width:8px;height:8px;padding:0;border-radius:999px;background:#F08A00}
  .pp-cell .vchip.akkoord{background:var(--ok)}
  .pimp-r{grid-template-columns:22px 82px 1fr;row-gap:0}
  .pimp-r input{grid-row:span 2}
  .pimp-t{grid-column:2;grid-row:2;font-size:12px}
  .pimp-x{grid-column:3;grid-row:1 / span 2}
  .pconf-d{min-width:0}
}
/* vakken kiezen */
.stag{display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.02em;padding:1px 4px;margin-right:4px;border-radius:4px;background:color-mix(in srgb,var(--fg) 12%,transparent);color:var(--fg);vertical-align:1px}
.plegend .stag{margin-left:6px}
.vakpick{display:flex;flex-direction:column;gap:6px}
.vp-row{background:var(--panel);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;transition:opacity var(--dur-fast) var(--ease)}
.vp-row.off{opacity:.55}
.vp-main{display:flex;align-items:center;gap:10px;cursor:pointer}
.vp-main .lab{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14.5px}
.vp-main .sub{font-size:12.5px;color:var(--dim);line-height:1.35}
.vp-main input[data-mixed]{opacity:.6}
.vp-types{display:flex;gap:6px;flex-wrap:wrap;padding-left:62px}
.vp-t{min-height:30px;padding:0 10px;border-radius:999px;border:none;background:transparent;box-shadow:inset 0 0 0 1px var(--lijn);color:var(--dim);font-size:12.5px;font-weight:600;cursor:pointer;transition:background-color var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
.vp-t.on{background:var(--accent);color:var(--onaccent);box-shadow:none}
.vp-t:active{transform:scale(.96)}
.pimp-det summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--accent);padding:6px 0}
.pimp-r.off{opacity:.5}
@media (max-width: 899px){ .vp-types{padding-left:32px} }
.shot-btn{display:flex;align-items:center;gap:14px;padding:18px;border-radius:16px;background:var(--acc,#0A7CFF);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.shot-btn:active{transform:scale(.98)}
.shot-btn svg{width:26px;height:26px;flex:none}
.shot-btn>span{display:flex;flex-direction:column;gap:2px}
.shot-btn .cap{color:rgba(255,255,255,.85)}
.shot-btn:focus-within{outline:3px solid var(--acc,#0A7CFF);outline-offset:2px}
.shot-busy{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;border-radius:16px;background:var(--soft);text-align:center}
.pimp-det .stack{gap:18px;padding-top:12px}
.pday.leeg{margin-bottom:-6px}
.pday.leeg .pday-t b{color:var(--dim);font-weight:500}
.pday.leeg .ib{opacity:.55}
/* polish: hit areas >= 44px, tekstafbreking */
.ib.sm,.vp-t,.btn.sm,.pp-wk,.pday-t{position:relative}
.ib.sm::after,.vp-t::after,.btn.sm::after,.pp-wk::after{content:'';position:absolute;inset:-5px}
.pp-wk::after{inset:-8px -4px}
h1,.h1,.h2,.gtitle,.pconf-h b{text-wrap:balance}
.note,.cap,.sub,.gfoot,.pconf-t{text-wrap:pretty}
.pev-time,.pimp-t,.pp-n,.pg-hl{font-variant-numeric:tabular-nums}
/* review-ronde 2 */
.pday .vv{margin-left:auto;margin-right:6px}
.pday-h .ib.sm{margin-left:auto}
.pday .vv + .ib.sm,.pday .ib.sm + .vv{margin-left:0}
.pconf-r.tap{width:100%;border:none;background:transparent;text-align:left;color:inherit;font:inherit;cursor:pointer;align-items:center}
.pconf-r.tap svg{width:16px;height:16px;color:var(--dim);flex:none}
@media (pointer:coarse){.hide-touch{display:none}}
.topbar .sync:not(.bad){display:none}
@media (max-width:700px){
  .ptool .btn span{display:inline}
  .ptool .btn{flex:1;justify-content:center}
  .ptool>span[style]{display:none}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:1ms!important;animation:none!important}
}
</style>

<body>
<div id="app"><p style="padding:24px">Planner wordt geladen…</p></div>
<div id="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="exceljs.min.js" defer></script>
<script>
// XLSX-BEGIN
var XL_SLOTS = 40, XL_STEP = 15, XL_LAST = 3 + XL_SLOTS;
function xlPad(n) { return (n < 10 ? '0' : '') + n; }
function xlTime(i) { var m = 480 + i * XL_STEP; return xlPad(Math.floor(m / 60)) + ':' + xlPad(m % 60); }
function xlRuns(slots) {
  var out = [], i = 0;
  while (i < slots.length) {
    var v = slots[i];
    if (!v) { i++; continue; }
    var j = i; while (j < slots.length && slots[j] === v) j++;
    out.push({ cat: v, start: i, end: j }); i = j;
  }
  return out;
}
function xlCol(i) { var s = '', n = i + 1; while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function xlMix(hex, other, t) {
  var a = parseInt(String(hex).slice(1), 16), b = parseInt(other.slice(1), 16);
  if (isNaN(a)) a = 0x8E8E93;
  return 'FF' + [16, 8, 0].map(function (s) { var v = Math.round(((a >> s) & 255) * t + ((b >> s) & 255) * (1 - t)).toString(16); return v.length < 2 ? '0' + v : v; }).join('').toUpperCase();
}

// d = { naam, doelen[5], weekLabel, range, cats: [{name, color, type}], days: [{n, date, slots: [soortnaam of '']}] }
// type = 'Gewerkt' | 'Afwezig' | 'Pauze' | 'Niet meetellen'
// Alles wat je ziet staat als tekst in uren:minuten (zo toont elke app en voorbeeldweergave het goed);
// de berekeningen staan in het verborgen tabblad Berekening.
function buildWorkbook(ExcelJS, d) {
  var wb = new ExcelJS.Workbook();
  wb.creator = 'Urenregistratie';
  wb.calcProperties.fullCalcOnLoad = true;
  var FONT = 'Arial', INK = 'FF2B2B2B', LINE = 'FFD9DEE4', SOFT = 'FFF6F6F4', DIM = 'FF5B6675', TOT = 'FFEDEDEA', WHITE = 'FFFFFFFF';
  var GREEN = { bg: 'FFDCF3E2', fg: 'FF17642F' }, GRAY = { bg: TOT, fg: 'FF3A3A3C' };
  var TYPES = ['Gewerkt', 'Afwezig', 'Pauze', 'Niet meetellen'];
  var cats = d.cats, N = cats.length, CS = {}, TYPE = {};
  cats.forEach(function (c) { CS[c.name] = { bg: xlMix(c.color, '#FFFFFF', 0.25), fg: xlMix(c.color, '#000000', 0.5) }; TYPE[c.name] = TYPES.indexOf(c.type) >= 0 ? c.type : 'Niet meetellen'; });
  var DAYCOLS = 'BCDEF';
  var thin = { style: 'thin', color: { argb: LINE } };
  var box = { top: thin, left: thin, bottom: thin, right: thin };
  var L = xlCol;
  var q = function (s) { return '"' + String(s).replace(/"/g, '""') + '"'; };
  // tekst uren:minuten, berekend in JavaScript (voor de opgeslagen resultaten)
  var mins = function (h) { return Math.round(h * 60); };
  var hm = function (h) { var m = Math.abs(mins(h)); return (mins(h) < 0 ? '-' : '') + Math.floor(m / 60) + ':' + xlPad(m % 60); };
  var hmS = function (h) { var m = mins(h); return (m > 0 ? '+' : '') + hm(h); };
  var clk = function (slot) { var m = 480 + slot * XL_STEP; return xlPad(Math.floor(m / 60)) + ':' + xlPad(m % 60); };
  // dezelfde tekst als Excel-formule (taalonafhankelijk, geen TEXT-functie)
  var R = function (ref) { return 'ROUND(' + ref + '*1440,0)'; };
  var fHM = function (ref) { return 'IF(' + R(ref) + '<0,"-","")&INT(ABS(' + R(ref) + ')/60)&":"&RIGHT("0"&MOD(ABS(' + R(ref) + '),60),2)'; };
  var fHMS = function (ref) { return 'IF(' + R(ref) + '>0,"+","")&' + fHM(ref); };
  var fCLK = function (ref) { return 'IF(' + ref + '="","",RIGHT("0"&INT(' + R(ref) + '/60),2)&":"&RIGHT("0"&MOD(' + R(ref) + ',60),2))'; };
  function fill(c) { return { type: 'pattern', pattern: 'solid', fgColor: { argb: c } }; }
  function put(ws, addr, value, o) {
    o = o || {};
    var c = ws.getCell(addr);
    c.value = value;
    c.font = { name: FONT, size: o.size || 10, bold: !!o.bold, italic: !!o.italic, color: { argb: o.color || 'FF1B1F1D' } };
    if (o.fill) c.fill = fill(o.fill);
    if (o.fmt) c.numFmt = o.fmt;
    c.alignment = { vertical: 'middle', horizontal: o.align || 'left', wrapText: !!o.wrap };
    if (o.box) c.border = box;
    return c;
  }
  var page = { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 };
  var wo = wb.addWorksheet('Weekoverzicht', { views: [{ showGridLines: false }], pageSetup: page, properties: { tabColor: { argb: 'FF2FA552' } } });
  var dg = wb.addWorksheet('Dagoverzicht', { views: [{ showGridLines: false }], pageSetup: Object.assign({}, page, { orientation: 'portrait' }) });
  var ps = wb.addWorksheet('Uren per soort', { views: [{ showGridLines: false }], pageSetup: page });
  var tb = wb.addWorksheet('Tijdblokken', { views: [{ state: 'frozen', xSplit: 1, ySplit: 3, showGridLines: false }], pageSetup: page });
  var st = wb.addWorksheet('Instellingen', { views: [{ showGridLines: false }] });
  var bk = wb.addWorksheet('Berekening', { state: 'hidden' });
  var dstr = function (dt) { return xlPad(dt.getDate()) + '-' + xlPad(dt.getMonth() + 1) + '-' + dt.getFullYear(); };

  // ---------- vooraf berekenen (opgeslagen resultaten + toelichting) ----------
  var rowsOut = d.days.map(function (day) {
    var t = { by: {}, all: 0, gew: 0, afw: 0, pau: 0, first: -1, last: -1 };
    day.slots.forEach(function (v, k) {
      if (!v) return;
      t.by[v] = (t.by[v] || 0) + 0.25; t.all += 0.25;
      var ty = TYPE[v] || 'Niet meetellen';
      if (ty === 'Gewerkt') t.gew += 0.25; else if (ty === 'Afwezig') t.afw += 0.25; else if (ty === 'Pauze') t.pau += 0.25;
      if (t.first < 0) t.first = k; t.last = k;
    });
    var gewCats = cats.filter(function (c) { return TYPE[c.name] === 'Gewerkt' && t.by[c.name]; });
    var parts = [];
    if (gewCats.length > 1 || (gewCats.length === 1 && gewCats[0].name !== 'Werk')) parts.push(gewCats.map(function (c) { return c.name + ' ' + hm(t.by[c.name]); }).join(', '));
    cats.filter(function (c) { return TYPE[c.name] === 'Afwezig' && t.by[c.name]; }).forEach(function (c) { parts.push(c.name + ' ' + hm(t.by[c.name])); });
    cats.filter(function (c) { return TYPE[c.name] === 'Niet meetellen' && t.by[c.name]; }).forEach(function (c) { parts.push(c.name + ' ' + hm(t.by[c.name]) + ' (niet meegeteld)'); });
    t.note = parts.join(' · ');
    return t;
  });
  var sum = function (k) { return rowsOut.reduce(function (a, t) { return a + t[k]; }, 0); };
  var gewW = sum('gew'), afwW = sum('afw'), pauW = sum('pau'), allW = sum('all');
  var doelW = d.doelen.reduce(function (a, b) { return a + b; }, 0);

  // ---------- Instellingen ----------
  st.columns = [{ width: 24 }, { width: 20 }, { width: 12 }];
  put(st, 'A1', 'Instellingen', { size: 16, bold: true, color: INK });
  put(st, 'A3', 'Naam', { bold: true }); put(st, 'B3', d.naam || '', { color: 'FF0000FF', box: true });
  put(st, 'A4', 'Week', { bold: true }); put(st, 'B4', d.weekLabel, { box: true });
  put(st, 'A5', 'Periode', { bold: true }); put(st, 'B5', d.range, { box: true });
  put(st, 'A6', 'Doel per dag (uren:minuten)', { bold: true });
  d.days.forEach(function (day, j) { put(st, 'A' + (7 + j), day.n, { box: true }); put(st, 'B' + (7 + j), hm(d.doelen[j]), { color: 'FF0000FF', fmt: '@', box: true, align: 'left' }); });
  var CF = 14, CL = 13 + N;
  put(st, 'A13', 'Soort', { bold: true, color: WHITE, fill: INK, box: true });
  put(st, 'B13', 'Telt als', { bold: true, color: WHITE, fill: INK, box: true, align: 'center' });
  put(st, 'C13', 'Kleur', { bold: true, color: WHITE, fill: INK, box: true });
  cats.forEach(function (c, i) {
    var r = CF + i;
    put(st, 'A' + r, c.name, { bold: true, color: CS[c.name].fg, fill: CS[c.name].bg, box: true });
    var cc = put(st, 'B' + r, TYPE[c.name], { color: 'FF0000FF', box: true, align: 'center' });
    cc.dataValidation = { type: 'list', allowBlank: false, formulae: ['"' + TYPES.join(',') + '"'] };
    put(st, 'C' + r, c.color, { color: DIM, box: true });
  });
  put(st, 'A' + (CL + 2), 'Telt als: Gewerkt = gewerkte uren, Afwezig = verlof/ziek/feestdag (telt mee voor het doel), Pauze en Niet meetellen tellen niet mee.', { color: DIM, italic: true });
  put(st, 'A' + (CL + 3), 'Blauwe cellen mag je aanpassen. Vul het doel in als uren:minuten, bijvoorbeeld 8:00. Nieuwe soorten en kleuren voeg je toe op de website.', { color: DIM, italic: true });
  var catRange = 'Instellingen!$A$' + CF + ':$A$' + CL;

  // ---------- Tijdblokken ----------
  tb.columns = [{ width: 15 }].concat(DAYCOLS.split('').map(function () { return { width: 16 }; }));
  tb.mergeCells('A1:F1');
  put(tb, 'A1', 'Tijdblokken · ' + d.weekLabel + ' · ' + d.range, { size: 14, bold: true, color: INK });
  tb.getRow(1).height = 24;
  tb.mergeCells('A2:F2');
  put(tb, 'A2', 'Kies per kwartier een soort uit de keuzelijst. Leeg = niet ingevuld. Dit tabblad kun je weer importeren op de website.', { color: DIM, italic: true, wrap: true }); tb.getRow(2).height = 28;
  put(tb, 'A3', 'Tijd', { bold: true, color: WHITE, fill: INK, align: 'center', box: true });
  d.days.forEach(function (day, j) {
    put(tb, DAYCOLS[j] + '3', day.n + ' ' + day.date.getDate() + '-' + (day.date.getMonth() + 1), { bold: true, color: WHITE, fill: INK, align: 'center', box: true });
  });
  tb.getRow(3).height = 22;
  for (var i = 0; i < XL_SLOTS; i++) {
    var r = 4 + i, full = i % 4 === 0;
    put(tb, 'A' + r, xlTime(i) + ' – ' + xlTime(i + 1), { bold: full, color: full ? 'FF1B1F1D' : DIM, fill: SOFT, box: true });
    d.days.forEach(function (day, j) {
      var v = day.slots[i];
      var c = put(tb, DAYCOLS[j] + r, v || null, { align: 'center', box: true, bold: true });
      c.dataValidation = { type: 'list', allowBlank: true, formulae: [catRange], showErrorMessage: true, errorTitle: 'Onbekende soort', error: 'Kies een soort uit de lijst, of laat de cel leeg. Nieuwe soorten voeg je toe op de website.' };
    });
    if (full) ['A'].concat(DAYCOLS.split('')).forEach(function (c) { tb.getCell(c + r).border = Object.assign({}, box, { top: { style: 'medium', color: { argb: 'FFB9B9B4' } } }); });
  }
  tb.addConditionalFormatting({
    ref: 'B4:F' + XL_LAST,
    rules: cats.map(function (c, n) {
      return { type: 'cellIs', operator: 'equal', priority: n + 1, formulae: [q(c.name)], style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: CS[c.name].bg } }, font: { color: { argb: CS[c.name].fg }, bold: true } } };
    })
  });

  // ---------- Berekening (verborgen, alle getallen in dagdelen) ----------
  // rij 2: telt als, rij 3: soortnamen, rij 4-8: dagen, rij 9: totaal
  var B0 = 1, BG = B0 + N, BP = BG + 1, BA = BP + 1, BT = BA + 1, BD = BT + 1, BV = BD + 1, BB = BV + 1, BE = BB + 1;
  var BFIRST = L(B0), BLAST = L(B0 + N - 1);
  put(bk, 'A1', 'Rekenblad voor de andere tabbladen (niet aanpassen).', { italic: true, color: DIM });
  put(bk, 'A2', 'Telt als'); put(bk, 'A3', 'Dag');
  cats.forEach(function (c, k) { put(bk, L(B0 + k) + '2', { formula: 'Instellingen!$B$' + (CF + k), result: TYPE[c.name] }); put(bk, L(B0 + k) + '3', c.name); });
  [[BG, 'Gewerkt'], [BP, 'Pauze'], [BA, 'Afwezig'], [BT, 'Totaal'], [BD, 'Doel'], [BV, 'Verschil'], [BB, 'Begin'], [BE, 'Einde']].forEach(function (h) { put(bk, L(h[0]) + '3', h[1]); });
  var TROW = BFIRST + '$2:$' + BLAST + '$2';
  d.days.forEach(function (day, j) {
    var r = 4 + j, col = DAYCOLS[j], rng = 'Tijdblokken!$' + col + '$4:$' + col + '$' + XL_LAST, t = rowsOut[j], cr = BFIRST + r + ':' + BLAST + r;
    put(bk, 'A' + r, day.n);
    cats.forEach(function (c, k) { var LL = L(B0 + k); put(bk, LL + r, { formula: 'COUNTIF(' + rng + ',' + LL + '$3)*15/1440', result: mins(t.by[c.name] || 0) / 1440 }); });
    put(bk, L(BG) + r, { formula: 'SUMIF($' + TROW + ',"Gewerkt",' + cr + ')', result: mins(t.gew) / 1440 });
    put(bk, L(BP) + r, { formula: 'SUMIF($' + TROW + ',"Pauze",' + cr + ')', result: mins(t.pau) / 1440 });
    put(bk, L(BA) + r, { formula: 'SUMIF($' + TROW + ',"Afwezig",' + cr + ')', result: mins(t.afw) / 1440 });
    put(bk, L(BT) + r, { formula: 'SUM(' + cr + ')', result: mins(t.all) / 1440 });
    var ds = 'Instellingen!$B$' + (7 + j);

// Leest het tabblad Tijdblokken en geeft per dag de soortnamen per kwartier terug.
function readSlots(ExcelJS, buf) {
  var wb = new ExcelJS.Workbook();
  return wb.xlsx.load(buf).then(function () {
    var ws = wb.worksheets.find(function (w) { return /tijdblok/i.test(w.name); }) || wb.worksheets[0];
    if (!ws) throw new Error('het bestand bevat geen tabbladen');
    var val = function (v) {
      if (v == null) return '';
      if (v instanceof Date) return v;
      if (typeof v === 'object') {
        if (v.richText) return v.richText.map(function (x) { return x.text; }).join('');
        if (v.result !== undefined) return val(v.result);
        if (v.text !== undefined) return String(v.text);
        return '';
      }
      return v;
    };
    var hr = -1, tcol = -1, max = Math.min(ws.rowCount, 60);
    for (var r = 1; r <= max && hr < 0; r++) {
      var row = ws.getRow(r);
      for (var c = 1; c <= Math.max(row.cellCount, 1); c++) {
        if (String(val(row.getCell(c).value)).trim().toLowerCase() === 'tijd') { hr = r; tcol = c; break; }
      }
    }
    if (hr < 0) throw new Error('geen kolom "Tijd" gevonden in tabblad "' + ws.name + '"');
    var names = ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag'], shorts = ['ma', 'di', 'wo', 'do', 'vr'];
    var cols = {}, head = ws.getRow(hr);
    for (var c2 = 1; c2 <= head.cellCount; c2++) {
      var h = String(val(head.getCell(c2).value)).trim().toLowerCase();
      names.forEach(function (n, k) { if (cols[shorts[k]] === undefined && (h.indexOf(n) === 0 || h === shorts[k])) cols[shorts[k]] = c2; });
    }
    if (!Object.keys(cols).length) throw new Error('geen kolommen Maandag t/m Vrijdag gevonden');
    var grid = {}; shorts.forEach(function (k) { grid[k] = new Array(XL_SLOTS).fill(''); });
    var filled = 0;
    for (var r2 = hr + 1; r2 <= ws.rowCount; r2++) {
      var rw = ws.getRow(r2), tv = val(rw.getCell(tcol).value), mins = -1, endM = -1;
      if (tv instanceof Date) mins = tv.getUTCHours() * 60 + tv.getUTCMinutes();
      else if (typeof tv === 'number') mins = Math.round(tv * 1440) % 1440;
      else {
        var ms = String(tv).match(/(\d{1,2})[:.](\d{2})/g) || [];
        var toM = function (x) { var p = x.split(/[:.]/); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); };
        if (ms[0]) mins = toM(ms[0]);
        if (ms[1]) endM = toM(ms[1]);
      }
      if (mins < 0) continue;
      if (endM <= mins) endM = mins + XL_STEP;
      var a = (mins - 480) / XL_STEP, b2 = (endM - 480) / XL_STEP;
      if (a !== Math.floor(a) || b2 !== Math.floor(b2)) continue;
      a = Math.max(0, a); b2 = Math.min(XL_SLOTS, b2);
      if (a >= b2) continue;
      shorts.forEach(function (k) {
        if (cols[k] === undefined) return;
        var s = String(val(rw.getCell(cols[k]).value)).trim().slice(0, 40);
        for (var q2 = a; q2 < b2; q2++) { grid[k][q2] = s; if (s) filled++; }
      });
    }
    return { grid: grid, filled: filled };
  });
}

    if (s.type === 'sync' && t.getAttribute('data-sin')) { s[t.getAttribute('data-sin')] = t.value; return; }
    var ci = t.getAttribute('data-cinput'), mi = t.getAttribute('data-minput');
    if (ci === 'name') {
      s.name = t.value; if (s.err) { s.err = ''; var w = sheetEl.querySelector('.note.warn'); if (w) w.remove(); }
      var pn = sheetEl.querySelector('[data-prevname]'); if (pn) pn.textContent = cleanName(t.value) || 'Naam van de soort';
    }
    if (ci === 'color') {
      s.color = t.value.toUpperCase();
      var st = styleFor(s.color), pv = sheetEl.querySelector('[data-prev]');
      if (pv) { pv.style.background = st.bg; pv.style.color = st.fg; var sq = pv.querySelector('.icon-sq'); if (sq) { sq.style.background = s.color; sq.style.color = onColor(s.color); } }
      var lab = t.closest('.swb'); if (lab) lab.style.background = s.color;
    }
    if (mi === 'naar') { S.inst.mailNaar = t.value.trim(); refreshMailLink(); }
  });
  sheetEl.addEventListener('change', function (e) {
    var t = e.target, s = S.sheet; if (!s) return;
    if (/^pl/.test(s.type)) { plSheetChange(t, s); return; }
    if (t.getAttribute('data-cinput') === 'color') { renderSheet(); return; }
    if (t.getAttribute('data-minput') === 'naar') { saveInst({ mailNaar: t.value.trim() }); return; }
    var c = t.getAttribute('data-schange'); if (!c) return;
    if (c === 'van') { s.van = parseInt(t.value, 10); if (s.tot <= s.van) s.tot = Math.min(SLOTS, s.van + 4); }
    if (c === 'tot') s.tot = parseInt(t.value, 10);
    var id = t.id; renderSheet(); var el = document.getElementById(id); if (el) try { el.focus({ preventScroll: true }); } catch (er) {}
  });
  sheetEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'cName' && S.sheet && S.sheet.type === 'cat') { e.preventDefault(); commitCat(S.sheet); }
    if (e.key === 'Enter' && e.target.id === 'mNaar') { e.preventDefault(); e.target.blur(); }
    if (e.key === 'Enter' && S.sheet && S.sheet.type === 'sync' && e.target.tagName === 'INPUT') { e.preventDefault(); syncConnect(S.sheet); }
  });

  // ---------- melding ----------
  var toastEl = document.getElementById('toast'), toastTimer = null;
  function toast(text, o) {
    o = o || {};
    clearTimeout(toastTimer);
    toastEl.className = 'toast' + (o.err ? ' err' : '');
    toastEl.innerHTML = '<span>' + esc(text) + '</span>' + (o.undo || o.plundo ? '<button type="button" data-tact="' + (o.plundo ? 'plundo' : 'undo') + '">Ongedaan maken</button>' : '') + (o.retry ? '<button type="button" data-tact="retry" data-doc="' + esc(o.retry) + '">Opnieuw</button>' : '');
    requestAnimationFrame(function () { toastEl.classList.add('show'); });
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, o.err ? 8000 : o.undo || o.plundo ? 6000 : 3600);
  }
  toastEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-tact]'); if (!b) return;
    toastEl.classList.remove('show');
    if (b.getAttribute('data-tact') === 'undo') undo();
    else if (b.getAttribute('data-tact') === 'plundo') plRestore();
    else { var id = b.getAttribute('data-doc'); pending[id] = true; flush(id); }
  });

  // ---------- Excel ----------
  function mapImported(res) {
    var byName = {}, created = [], list = null, g = emptyGrid(), usedColors = CATS.map(function (c) { return c.color; });
    CATS.forEach(function (c) { byName[c.name.toLowerCase()] = c.id; });
    DAYS.forEach(function (d) {
      res.grid[d.k].forEach(function (name, i) {
        if (!name) return;
        var key = name.toLowerCase(), id = byName[key];
        if (!id) {
          if (!list) list = plainCats();
          var nm = cleanName(name) || 'Soort';
          var free = SWATCHES.find(function (x) { return usedColors.indexOf(x[0]) < 0; });
          var color = free ? free[0] : SWATCHES[created.length % SWATCHES.length][0];
          usedColors.push(color);
          id = newId() + created.length;
          list.push({ id: id, name: nm, color: color, telt: false, hidden: false });
          byName[key] = id; created.push(nm);
        }
        g[d.k][i] = id;
      });
    });
    return { grid: g, created: created, list: list };
  }
  function readFile(file) {
    if (file.arrayBuffer) return file.arrayBuffer();
    return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(fr.result); }; fr.onerror = function () { rej(new Error('het bestand kon niet worden gelezen')); }; fr.readAsArrayBuffer(file); });
  }
  function doImport(file) {
    var X = window.ExcelJS, wk = weekInfo(S.offset);
    if (!X) { toast('De Excel-functie wordt nog geladen. Probeer het zo opnieuw.', { err: true }); return; }
    readFile(file).then(function (buf) { return readSlots(X, buf); }).then(function (res) {
      var cur = grid(wk.key), curH = DAYS.reduce(function (a, d) { return a + totals(cur[d.k]).all; }, 0), newH = res.filled / 4;
      var apply = function () {
        var m = mapImported(res);
        if (m.list) saveInst({ cats: m.list });
        remember(wk.key, 'import');
        if (isEmptyGrid(m.grid)) delete S.weeks[wk.key]; else S.weeks[wk.key] = m.grid;
        queue('w' + wk.key); render();
        toast('Geïmporteerd in week ' + wk.num + ': ' + fmtH(newH) + ' uur.' + (m.created.length ? ' Nieuwe soorten: ' + m.created.join(', ') + '. Controleer ze bij Instellingen.' : ''), { undo: !m.created.length });
      };
      if (curH === 0) apply();
      else confirmSheet('Week ' + wk.num + ' vervangen?', 'Het bestand bevat ' + fmtH(newH) + ' uur. De ' + fmtH(curH) + ' uur die nu in week ' + wk.num + ' staan, worden vervangen. Je kunt dit daarna ongedaan maken.', 'Vervangen', false, apply);
    }).catch(function (e) { toast('Importeren lukte niet: ' + (e && e.message ? e.message : 'onbekend bestand') + '.', { err: true }); });
  }
  function doExport() {
    var X = window.ExcelJS, wk = weekInfo(S.offset), g = grid(wk.key);
    if (!X) { toast('De Excel-functie wordt nog geladen. Probeer het zo opnieuw.', { err: true }); return; }
    if (!dl) { toast('Downloaden kan in deze weergave niet. Open de pagina via claude.ai.', { err: true }); return; }
    var name = 'urenregistratie-' + wk.key + '.xlsx';
    var cats = CATS.map(function (c) { return { name: c.name, color: c.color, type: catType(c) }; }), unknown = false;
    var days = DAYS.map(function (d, i) { return { n: d.n, date: wk.dates[i], slots: g[d.k].map(function (v) { if (!v) return ''; if (!CMAP[v]) unknown = true; return catOf(v).name; }) }; });
    if (unknown && !cats.some(function (c) { return c.name === 'Onbekend'; })) cats.push({ name: 'Onbekend', color: '#8E8E93', type: 'Niet meetellen' });
    var data = { naam: S.inst.naam, doelen: DAYS.map(function (_, i) { return doelVoor(i); }), weekLabel: 'Week ' + wk.num, range: wk.range, cats: cats, days: days };
    buildWorkbook(X, data).xlsx.writeBuffer().then(function (buf) {
      return dl.save({ filename: name, data: new Blob([buf]) });
    }).then(function () {
      S.exported[wk.key] = true;
      if (S.sheet && S.sheet.type === 'share') renderSheet();
      toast('Excel van week ' + wk.num + ' is opgeslagen als ' + name + '.');
    }, function (e) {
      if (e && e.code === 'declined') toast('Download geannuleerd.');
      else if (e && e.code === 'rate_limited') toast('Er staat al een downloadvenster open.', { err: true });
      else toast('Exporteren lukte niet: ' + (e && e.message ? e.message : 'onbekende fout') + '.', { err: true });
    });
  }

  // ---------- tekenen met muis en aanraking ----------
  var drag = null, press = null;
  function slotTarget(el) { return el && el.closest ? el.closest('[data-slot]') : null; }
  function slotAt(x, y) { return slotTarget(document.elementFromPoint(x, y)); }
  function startPaint(el) {
    ensureTool();
    var p = el.getAttribute('data-slot').split(':'), dk = p[0], i = parseInt(p[1], 10), wk = weekInfo(S.offset);
    var cur = grid(wk.key)[dk][i];
    var val = (S.tool === 'gum' || cur === S.tool) ? '' : S.tool;
    remember(wk.key, val ? catOf(val).name.toLowerCase() + ' ingevuld' : 'gewist');
    drag = { val: val, dk: dk, key: wk.key, changed: false, last: i };
    paintAt(el);
  }
  function paintAt(el) {
    if (!drag || !el) return;
    var p = el.getAttribute('data-slot').split(':');
    if (p[0] !== drag.dk) return;
    var i = parseInt(p[1], 10), from = Math.min(i, drag.last), to = Math.max(i, drag.last) + 1;
    drag.last = i;
    if (setRange(drag.key, drag.dk, from, to, drag.val)) { drag.changed = true; render(); }
  }
  function endPaint() {
    if (!drag) return;
    if (!drag.changed) undoStack.pop();
    drag = null;
    root.querySelectorAll('[data-act="undo"]').forEach(function (b) { b.disabled = !undoStack.length; });
    applyHits();
  }
  root.addEventListener('mousedown', function (e) {
    var s = slotTarget(e.target); if (!s || e.button !== 0) return;
    e.preventDefault(); startPaint(s);
  });
  root.addEventListener('mouseover', function (e) { if (drag && !press) paintAt(slotTarget(e.target)); });
  window.addEventListener('mouseup', function () { if (!press) endPaint(); });
  root.addEventListener('touchstart', function (e) {
    var s = slotTarget(e.target); if (!s || e.touches.length > 1) return;
    var t = e.touches[0];
    press = { el: s, x: t.clientX, y: t.clientY, long: false, moved: false };
    press.timer = setTimeout(function () {
      if (!press || press.moved) return;
      press.long = true;
      if (navigator.vibrate) try { navigator.vibrate(8); } catch (er) {}
      startPaint(press.el);
    }, 320);
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!press) return;
    var t = e.touches[0];
    if (press.long) { e.preventDefault(); paintAt(slotAt(t.clientX, t.clientY)); return; }
    if (Math.abs(t.clientX - press.x) > 8 || Math.abs(t.clientY - press.y) > 8) { press.moved = true; clearTimeout(press.timer); }
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (!press) return;
    clearTimeout(press.timer);
    var p = press; press = null;
    if (p.long) { e.preventDefault(); endPaint(); return; }
    if (!p.moved) { e.preventDefault(); startPaint(p.el); endPaint(); }
  });
  root.addEventListener('contextmenu', function (e) { if (slotTarget(e.target) || drag) e.preventDefault(); });
  document.addEventListener('touchcancel', function () { if (press) { clearTimeout(press.timer); var p = press; press = null; if (p.long) endPaint(); } });

  // ---------- klikken ----------
  root.addEventListener('click', function (e) {
    var s = slotTarget(e.target);
    if (s) { if (e.detail === 0) { startPaint(s); endPaint(); } return; }
    if (S.view === 'plan' && plColClick(e)) return;
    var a = e.target.closest('[data-act]'); if (!a) return;
    var act = a.getAttribute('data-act'), v = a.getAttribute('data-v'), wk = weekInfo(S.offset), di = parseInt(a.getAttribute('data-di'), 10);
    if (plClick(act, a)) return;
    switch (act) {
      case 'view': go(function () { S.view = v; try { localStorage.setItem(VIEWKEY, v); } catch (er) {} }); return;
      case 'syncset': var sc = Sync.cfg(); openSheet({ type: 'sync', repo: sc ? sc.repo : 'LuvaEmilio/planner-data', token: '', pass: '' }); return;
      case 'syncnow': Sync.now(); return;
      case 'syncoff': confirmSheet('Ontkoppelen?', 'Dit apparaat synchroniseert dan niet meer. Je gegevens blijven op dit apparaat en in GitHub staan.', 'Ontkoppelen', true, function () { Sync.off(); render(); toast('Ontkoppeld.'); }); return;
      case 'backup': doBackup(); return;
      case 'tool': S.tool = v; break;
      case 'openday': go(function () { S.view = 'dag'; S.dayIdx = di; }); return;
      case 'pickday': navDir = di < S.dayIdx ? 'prev' : di > S.dayIdx ? 'next' : ''; S.dayIdx = di; break;
      case 'calpick': if (S.view === 'plan') { S.pMode = 'week'; S.pOffset = parseInt(a.getAttribute('data-off'), 10); S.calShift = 0; render(); return; } go(function () { S.offset = parseInt(a.getAttribute('data-off'), 10); S.dayIdx = di; S.view = 'dag'; S.calShift = 0; }); return;
      case 'calprev': S.calShift--; break;
      case 'calnext': S.calShift++; break;
      case 'prev': case 'next': step(act === 'prev' ? -1 : 1); return;
      case 'today': S.offset = 0; S.dayIdx = todayIdx(); S.calShift = 0; break;
      case 'undo': undo(); return;
      case 'newblk': newBlockSheet(); return;
      case 'newcat': catSheet(null); return;
      case 'editcat': catSheet(v); return;
      case 'share': if (S.view === 'plan') { plClick('pshare', a); return; } openSheet({ type: 'share' }); return;
      case 'mview': S.mview = v; mviewSet(v); break;
      case 'fillstd':
        fillDay(wk.key, DAYS[S.dayIdx].k, stdDay(), 'standaarddag ingevuld');
        render(); toast('Standaarddag ingevuld op ' + DAYS[S.dayIdx].n.toLowerCase() + '.', { undo: true }); return;
      case 'fillprev':
        var pv = prevDayInfo(wk, S.dayIdx);
        fillDay(wk.key, DAYS[S.dayIdx].k, grid(pv.key)[pv.dk], 'gekopieerd van ' + pv.label);
        render(); toast('Uren van ' + pv.label + ' gekopieerd.', { undo: true }); return;
      case 'savestd':
        saveInst({ std: grid(wk.key)[DAYS[S.dayIdx].k].slice() });
        render(); toast('Bewaard als standaarddag: ' + describe(stdDay()) + '.'); return;
      case 'resetstd': saveInst({ std: null }); render(); toast('Standaarddag teruggezet.'); return;
      case 'fillweek':
        var ew = emptyWorkDays(wk); if (!ew.length) return;
        remember(wk.key, 'lege dagen ingevuld');
        var ngw = cloneGrid(grid(wk.key)), sd = stdDay();
        ew.forEach(function (i) { ngw[DAYS[i].k] = sd.slice(); });
        S.weeks[wk.key] = ngw; queue('w' + wk.key);
        render(); toast(ew.length + (ew.length === 1 ? ' dag' : ' dagen') + ' ingevuld met je standaarddag.', { undo: true }); return;
      case 'editblk':
        var a1 = parseInt(a.getAttribute('data-a'), 10), b1 = parseInt(a.getAttribute('data-b'), 10), cat = grid(wk.key)[DAYS[S.dayIdx].k][a1];
        openSheet({ type: 'blok', di: S.dayIdx, cat: cat, van: a1, tot: b1, orig: { start: a1, end: b1, cat: cat, di: S.dayIdx } }); return;
      case 'clearday':
        remember(wk.key, DAYS[S.dayIdx].n.toLowerCase() + ' leeggemaakt');
        setRange(wk.key, DAYS[S.dayIdx].k, 0, SLOTS, '');
        render(); toast(DAYS[S.dayIdx].n + ' is leeggemaakt.', { undo: true }); return;
      case 'clearweek':
        if (isEmptyGrid(S.weeks[wk.key])) { toast('Week ' + wk.num + ' is al leeg.'); return; }
        confirmSheet('Week ' + wk.num + ' leegmaken?', 'Alle blokken van ' + wk.range + ' worden verwijderd. Je kunt dit daarna nog ongedaan maken.', 'Leegmaken', true, function () {
          remember(wk.key, 'week leeggemaakt'); delete S.weeks[wk.key]; queue('w' + wk.key); render(); toast('Week ' + wk.num + ' is leeggemaakt.', { undo: true });
        }); return;
      case 'palet': saveInst({ palet: v }); break;
      case 'start': saveInst({ start: v }); break;
      case 'thema': saveInst({ thema: v }); break;
      case 'export': doExport(); return;
    }
    render();
  });
  function step(dir) {
    navDir = dir < 0 ? 'prev' : 'next';
    if (S.view === 'dag') { var k = S.dayIdx + dir; if (k < 0) { k = 4; S.offset--; } if (k > 4) { k = 0; S.offset++; } S.dayIdx = k; }
    else S.offset += dir;
    S.calShift = 0; render();
  }
  root.addEventListener('change', function (e) {
    var t = e.target, c = t.getAttribute && t.getAttribute('data-change'); if (!c) return;
    if (c === 'import') { var file = t.files && t.files[0]; if (file) doImport(file); try { t.value = ''; } catch (er) {} return; }
    if (c === 'restore') { var rf = t.files && t.files[0]; if (rf) doRestore(rf); try { t.value = ''; } catch (er) {} return; }
    if (c === 'perstart') { if (/^\d{4}-\d{2}-\d{2}$/.test(t.value)) { saveInst({ periodeStart: t.value }); toast('Werkperiodes beginnen nu op ' + dLabel(mondayOf(parseD(t.value)), true) + '.'); } return; }
    if (c === 'werknaam') { saveInst({ werkNaam: t.value.trim().slice(0, 40) }); return; }
    if (c === 'naam') { saveInst({ naam: t.value.trim().slice(0, 60) }); toast('Naam bewaard.'); return; }
    if (c === 'doeldag') { var dd = Object.assign({}, S.inst.doelDag || {}); DAYS.forEach(function (x, i) { if (dd[x.k] == null) dd[x.k] = doelVoor(i); }); dd[t.getAttribute('data-day')] = parseFloat(t.value); saveInst({ doelDag: dd }); }
    if (c === 'doelalle' && t.value !== '') { var v2 = parseFloat(t.value), all = {}; DAYS.forEach(function (x) { all[x.k] = v2; }); saveInst({ doelDag: all, doel: v2 }); toast('Elke dag staat nu op ' + fmtH(v2) + ' uur.'); }
    render();
  });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'iNaam') { e.target.blur(); }
  });
  document.addEventListener('keydown', function (e) {
    if (S.sheet) {
      if (e.key === 'Escape') { e.preventDefault(); if (S.sheet.busy) return; if (S.sheet.type === 'cat' && S.sheet.back) openSheet(S.sheet.back); else closeSheet(); }
      if (e.key === 'Tab') {
        var f = [].slice.call(sheetEl.querySelectorAll('button:not([disabled]), select, input, textarea, a[href]')).filter(function (x) { return x.offsetParent !== null || x === document.activeElement; });
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
      return;
    }
    var tag = (e.target.tagName || '').toUpperCase();
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) { if (tag === 'INPUT') return; e.preventDefault(); undo(); return; }
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (S.view === 'inst') return;
    if (S.view === 'plan') { if (e.key === 'ArrowLeft') { e.preventDefault(); plClick('pprev', document.body); } else if (e.key === 'ArrowRight') { e.preventDefault(); plClick('pnext', document.body); } else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); evSheet(null); } else if (e.key === 't' || e.key === 'T') { S.pOffset = 0; render(); } return; }
    var vis = visibleCats();
    if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 't' || e.key === 'T') { S.offset = 0; S.dayIdx = todayIdx(); S.calShift = 0; render(); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); newBlockSheet(); }
    else if (e.key === '0') { S.tool = 'gum'; render(); }
    else if (/^[1-9]$/.test(e.key) && vis[parseInt(e.key, 10) - 1]) { S.tool = vis[parseInt(e.key, 10) - 1].id; render(); }
  });
  setInterval(function () { if (!drag && !press && !S.sheet && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) render(); }, 30000);
  window.addEventListener('beforeunload', function () { Object.keys(timers).forEach(flush); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) Object.keys(timers).forEach(flush); });

  if (mqPhone) { var onPh = function () { if (!drag && !press) render(); }; if (mqPhone.addEventListener) mqPhone.addEventListener('change', onPh); else if (mqPhone.addListener) mqPhone.addListener(onPh); }
  render();
  connect();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', function () { if (nw.state === 'installed' && navigator.serviceWorker.controller) { var t = document.getElementById('toast'); if (t) { t.className = 'toast show'; t.innerHTML = '<span>Er is een nieuwe versie.</span><button type="button" onclick="location.reload()">Vernieuwen</button>'; } } });
      });
    }).catch(function () {});
  });
}
